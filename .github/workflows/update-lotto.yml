name: Update official Lotto data
on:
  push:
    branches: [main]
  schedule:
    # Primary Saturday collection: 21:17–23:47 KST.
    - cron: '17,47 12-14 * * 6'
    # Catch up overnight and on Sunday if GitHub delays/drops a scheduled event.
    - cron: '23 15-23 * * 6'
    - cron: '23 0-14 * * 0'
    # Weekday safety net: 13:23 KST; no official requests when already current.
    - cron: '23 4 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotto-data
  cancel-in-progress: false
jobs:
  update:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check whether collection is due
        id: freshness
        run: python tools/refresh_status.py
      - name: Collect and validate complete snapshot
        if: steps.freshness.outputs.collect == 'true'
        run: python tools/update_data.py
      - name: Check snapshot consistency
        run: |
          python tools/check_snapshot.py
          python tools/refresh_status.py --require-current
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CSV
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated official Lotto snapshot'
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Build crawlable generator page
        run: python tools/build_search_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
